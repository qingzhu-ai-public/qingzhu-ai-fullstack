<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>课程文章 · 青竹全栈学习指南</title>
  <link rel="icon" href="../assets/brand.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../assets/style.css">
  <link rel="stylesheet" href="../assets/content/lesson.css">
</head>
<body>
  <a class="skip-link" href="#main">跳到正文</a>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="../index.html">
        <img src="../assets/brand.svg" alt="" width="30" height="30">
        <span>青竹全栈学习指南</span>
      </a>
      <nav class="site-nav" aria-label="技术栈">
        <a href="../index.html">总览</a>
        <a data-track="backend" href="backend/index.html">后端</a>
        <a data-track="frontend" href="frontend/index.html">前端</a>
        <a data-track="mobile" href="mobile/index.html">移动端</a>
        <a data-track="cross" href="cross-platform/index.html">跨平台</a>
        <a data-track="ai" href="ai/index.html">AI 应用</a>
      </nav>
      <a class="repo-link" href="https://github.com/qingzhu-ai-public/qingzhu-ai-fullstack" target="_blank" rel="noopener" aria-label="本站 GitHub 仓库">
        <svg class="icon" aria-hidden="true"><use href="../assets/icons.svg#github"/></svg>
        <span>GitHub</span>
      </a>
    </div>
  </header>

  <main class="page" id="main">
    <div class="doc-layout">
      <aside class="lesson-nav">
        <div class="nav-head"><span id="navHead"></span><a id="backLink" href="../index.html">返回目录</a></div>
        <div id="lessonNav"></div>
      </aside>

      <article class="article">
        <h1 id="articleTitle"></h1>
        <p class="article-meta" id="articleMeta"></p>
        <div id="articleBody"></div>
      </article>

      <aside class="article-toc">
        <h2>文章目录</h2>
        <nav id="toc" aria-label="文章目录"></nav>
      </aside>
    </div>
  </main>

  <script src="../assets/catalog.js"></script>
  <script src="../assets/content/java-mid.js"></script>
  <script src="../assets/content/java-beg.js"></script>
  <script src="../assets/content/java-adv.js"></script>
  <script src="../assets/content/java-src.js"></script>
  <script src="../assets/content/vue-beg.js"></script>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var trackId = params.get('track') || 'backend';
      var track = QZ_CATALOG.getTrack(trackId);
      if (!track) { trackId = 'backend'; track = QZ_CATALOG.getTrack(trackId); }

      var stack = QZ_CATALOG.getStack(trackId, params.get('stack')) || track.stacks[0];
      var lessonName = params.get('lesson');
      if (!lessonName || !QZ_CATALOG.findLesson(trackId, stack.id, lessonName)) {
        lessonName = QZ_CATALOG.firstLesson(trackId, stack.id);
      }
      var found = QZ_CATALOG.findLesson(trackId, stack.id, lessonName);
      var esc = QZ_CATALOG.esc;
      var displayName = found ? lessonName : stack.name + ' · 课程整理中';

      var current = document.querySelector('.site-nav a[data-track="' + trackId + '"]');
      if (current) current.classList.add('is-current');

      document.title = displayName + ' · ' + stack.name + ' · 青竹全栈学习指南';
      document.getElementById('articleTitle').textContent = displayName;
      document.getElementById('navHead').textContent = track.label + ' / ' + stack.name;
      document.getElementById('backLink').setAttribute('href', track.dir + '/index.html');
      document.getElementById('lessonNav').innerHTML = QZ_CATALOG.levelsHtml(trackId, stack, 'article.html', lessonName, true);

      function runLessonEnhancements() {
        var tocLinks = [].slice.call(document.querySelectorAll('#toc a'));
        var secs = tocLinks.map(function (a) { return document.getElementById(a.getAttribute('href').slice(1)); });
        if ('IntersectionObserver' in window) {
          var io = new IntersectionObserver(function (es) {
            es.forEach(function (e) {
              if (e.isIntersecting) {
                tocLinks.forEach(function (a) { a.classList.toggle('on', a.getAttribute('href') === '#' + e.target.id); });
              }
            });
          }, { rootMargin: '-20% 0px -70% 0px' });
          secs.forEach(function (s) { if (s) io.observe(s); });
        }
        var box = document.getElementById('quiz-box');
        if (!box || typeof QUIZ === 'undefined') return;
        var solved = 0;
        QUIZ.forEach(function (item, qi) {
          var h = document.createElement('div'); h.className = 'quiz-q'; h.textContent = item.q; box.appendChild(h);
          var ex = document.createElement('div'); ex.className = 'explain';
          item.opts.forEach(function (o) {
            var text = o[0], ok = o[1], why = o[2];
            var b = document.createElement('button'); b.className = 'opt'; b.textContent = text; b.dataset.q = qi;
            b.addEventListener('click', function () {
              var sib = [].slice.call(box.querySelectorAll('[data-q="' + qi + '"]'));
              if (sib.some(function (s) { return s.disabled; })) return;
              sib.forEach(function (s) { s.disabled = true; });
              b.classList.add(ok ? 'right' : 'wrong');
              ex.className = 'explain show ' + (ok ? 'good' : 'bad');
              ex.textContent = (ok ? '✓ ' : '✗ ') + why;
              if (ok) { solved++; if (solved === QUIZ.length) { var d = document.getElementById('quiz-done'); if (d) d.style.display = 'block'; } }
              else setTimeout(function () { sib.forEach(function (s) { s.disabled = false; s.classList.remove('wrong'); }); ex.className = 'explain'; }, 2000);
            });
            box.appendChild(b);
          });
          box.appendChild(ex);
        });
      }

      var content = (window.QZ_CONTENT && QZ_CONTENT.get(trackId, stack.id, lessonName)) || null;
      var tocAside = document.querySelector('.article-toc');
      if (content) {
        if (tocAside) tocAside.hidden = false;
        document.getElementById('articleMeta').textContent = track.label + ' / ' + stack.name + ' / ' + found.level + ' · 青竹 ' + stack.name + ' 学堂 · 含交互演练与自测';
        document.getElementById('articleBody').innerHTML = content.body;
        document.getElementById('toc').innerHTML = content.toc.map(function (t) {
          return '<a href="#' + esc(t.id) + '">' + esc(t.title) + '</a>';
        }).join('');
        var ls = document.createElement('script'); ls.textContent = content.scripts; document.body.appendChild(ls);
        runLessonEnhancements();
      } else {
        if (tocAside) tocAside.hidden = true;
        document.getElementById('articleMeta').textContent = track.label + ' / ' + stack.name + (found ? ' / ' + found.level : '') + ' · 内容整理中';
        document.getElementById('toc').innerHTML = '';
        var realUrl = QZ_CATALOG.lessonUrl('backend', 'java', '六道关与模块设计', 'article.html');
        document.getElementById('articleBody').innerHTML =
          '<div class="empty-state">' +
            '<svg class="es-icon" viewBox="0 0 48 48" aria-hidden="true">' +
              '<rect x="9" y="6" width="30" height="36" rx="4" fill="none" stroke="currentColor" stroke-width="2.5"/>' +
              '<line x1="15" y1="16" x2="33" y2="16" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>' +
              '<line x1="15" y1="23" x2="33" y2="23" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>' +
              '<line x1="15" y1="30" x2="26" y2="30" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>' +
            '</svg>' +
            '<h2>这一课还在整理中</h2>' +
            '<p>' + (found
              ? '《' + esc(lessonName) + '》的正式正文尚未编写，这里先留一个空位。'
              : esc(stack.name) + ' 方向的课程尚未编写，目录暂时为空。') + '</p>' +
            '<p class="es-sub">Java 与 Vue 初级已有可阅读的课程，含图解、交互演练与自测。</p>' +
            '<a class="es-btn" href="' + esc(realUrl) + '">去看 Java 中级第一课 →</a>' +
          '</div>';
      }
    })();
  </script>
</body>
</html>
